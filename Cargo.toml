[package]
name = "shakespot"
version = "0.4.2"
description = "A lightweight Windows mouse locator activated by shaking the mouse"
license = "MIT"
readme = "README.md"
edition = "2024"
rust-version = "1.85"
publish = false
build = "rust/build.rs"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "ShakeSpot"
path = "rust/main.rs"

[[bench]]
name = "detector"
path = "rust/benches/detector.rs"
harness = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance",
  "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation",
  "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi",
  "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
