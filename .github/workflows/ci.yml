name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting and Clippy
        run: ./scripts/rust.ps1 check
      - name: Run regression tests
        run: ./scripts/rust.ps1 test
      - name: Run allocation and detector benchmarks
        run: ./scripts/rust.ps1 bench
      - name: Build release package
        run: ./scripts/rust.ps1 publish
      - name: Upload package and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShakeSpot-windows-x64
          path: |
            artifacts/ShakeSpot-*-win-x64.zip
            artifacts/ShakeSpot-*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
